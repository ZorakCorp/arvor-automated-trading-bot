name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest tests.test_bot -v
        env:
          OPENAI_API_KEY: sk-test-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRADINGVIEW_CHART_URL: https://www.tradingview.com/chart/ci-test/
          LIVE_TRADING: "false"

      - name: Smoke test
        run: python scripts/smoke_test.py
